<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flight Results2</title>
  <script src="https://kit.fontawesome.com/a7f82b9220.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }
    .page {
      border: 3px solid #222;
      min-height: 100vh;
    }
    header {
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0px 20px;
      border-bottom: 1px solid #999;
      background-color: #ffffff;
    }
    .logo {
      width: 300px;
      height: 95px;
      display: flex;
      align-items: center;
      margin-left: -100px;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    nav {
      display: flex;
      gap: 20px;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
      margin-left: -100px;
    }
    .login {
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      color: #000;
      min-width: 70px;
    }
    .login i {
      font-size: 22px;
      color: black;
      margin: 6px 0;
    }
    .avatar {
      width: 27px;
      height: 27px;
      border: 2px solid #000;
      border-radius: 50%;
      margin: 3px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      color: #000;
    }

    .sign-in {
      border: none;
      background: transparent;
      padding: 0;
      font-weight: bold;
      font-size: 11px;
      color: #000;
      cursor: pointer;
    }
    .booking-area {
      width: 1120px;
      margin: 35px auto;
      display: flex;
      border: 1px solid #777;
    }

    .passenger-details {
      width: 820px;
      padding: 18px 25px 30px;
      border-right: 1px solid #777;
    }

    .passenger-details h1 {
      color: #008fd3;
      font-size: 30px;
      margin: 0 0 30px;
    }

    .passenger-details h2 {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 35px;
      margin-bottom: 18px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      height: 28px;
      border: 1px solid #777;
      border-radius: 8px;
      padding: 0 6px;
      font-size: 14px;
      margin-top: 5px;
    }

    .small {
      width: 90px;
    }

    .medium {
      width: 230px;
    }

    .large {
      width: 300px;
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .checkbox-row {
      font-size: 11px;
      font-weight: bold;
      margin-top: 5px;
    }

    .summary {
      width: 300px;
    }

    .summary h2 {
      text-align: center;
      color:#008fd3;
      margin: 0;
      padding: 10px;
      border-bottom: 1px solid #777;
      font-size: 22px;
    }

    .flight-summary {
      padding: 8px 22px 20px;
      border-bottom: 1px solid #777;
    }

    .flight-summary h3 {
      text-align: center;
      margin: 0 0 8px;
    }

    .route {
      display: flex;
      justify-content: space-between;
      align-items: start;
    }

    .airport-code {
      font-size: 26px;
      font-weight: bold;
    }

    .line {
      width: 80px;
      border-top: 2px solid #555;
      margin-top: 18px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 18px 25px;
      font-size: 18px;
      font-weight: bold;
    }

    .total {
      border-top: 1px solid #777;
      display: flex;
      justify-content: space-between;
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
    }

    .total-price {
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <div class="logo">
        <img src="FlyDreamAir.png" alt="Logo">
      </div>

      <nav>
        <span>Search Flights</span>
        <span>Manage Bookings</span>
        <span>Check-In</span>
        <span>Support</span>
      </nav>

      <div class="login">
        <div>A Member?</div>
        <i class="fa-solid fa-user"></i>
        <button class="sign-in">Sign In</button>
      </div>
    </header>
        <main class="booking-area">

      <section class="passenger-details">
        <h1>1. PASSENGER DETAILS</h1>
        <h2 id="passanger type">PASSENGER 1: ADULT</h2>

        <div class="form-row">
          <label class="field">
            Title
            <select class="small">
              <option>Miss</option>
              <option>Ms</option>
              <option>Mrs</option>
              <option>Mr</option>
            </select>
          </label>

          <label class="field">
            First Name
            <input class="medium" type="text" value="">
          </label>

          <label class="field">
            Last Name
            <input class="medium" type="text" value="">
          </label>
        </div>

        <div class="form-row">
          <label class="field">
            Date of Birth
            <input class="medium" type="text" value="">
          </label>

          <label class="field">
            Gender
            <select class="medium">
              <option>Female</option>
              <option>Male</option>
              <option>Other</option>
            </select>
          </label>

          <label class="field">
            Nationality
            <select class="medium">
              <option>Australian</option>
              <option>New Zealand</option>
            </select>
          </label>
        </div>

        <div class="form-row">
          <label class="field">
            Email Address
            <input class="large" type="email" value="">
          </label>

          <label class="field">
            Phone Number
            <div class="phone-row">
              <select class="small">
                <option>+61</option>
              </select>
              <input class="medium" type="text" value="">
            </div>
          </label>

          <label class="field">
            Post Code
            <input class="small" type="text" value="">
          </label>
        </div>

        <div class="form-row">
          <div class="checkbox-row">
            <input type="checkbox" id="travelFoBuss">
            Travelling for Business
          </div>

          <label class="field" id="abnField">
            ABN
            <input class="large" type="text" value="">
          </label>
        </div>
      </section>

      <aside class="summary">
        <h2>BOOKING SUMMARY</h2>

        <div class="flight-summary">
          <h3>Departure Flight</h3>

          <div class="route">
            <div>
              <div class="airport-code" id="departureCode">SYD</div>
              <div id="departureCity">Sydney</div>
              <div id="departureDate">Sat, 23 May</div>
              <div id="departureYear">2026</div>
              <div id="departureTime">8:00</div>
            </div>

            <div class="line"></div>

            <div>
              <div class="airport-code" id="arivalCode">MEL</div>
              <div id="arrivalCity">Melbourne</div>
              <div id="arrivalDate">Sat, 23 May</div>
              <div id="arrivalYear">2026</div>
              <div id="arrivalTime">9:30</div>
            </div>
          </div>
        </div>

        <div class="price-row">
          <span>1 Adult</span>
          <span>$129.00</span>
        </div>

        <div class="price-row">
          <span>Taxes and<br>Fees</span>
          <span>$41.00</span>
        </div>

        <div class="total">
          <span>Total</span>
          <span class="total-price">AUD $170.00</span>
        </div>
      </aside>

    </main>

  </div>
</body>
<script type="module" src="bookingMain.js"></script>

</html>
