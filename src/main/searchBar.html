<!DOCTYPE html>
<html lang = "en">
<head><script src="https://kit.fontawesome.com/a7f82b9220.js" crossorigin="anonymous"></script>
  <title>Search flights page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .page {
      border: 3px solid #222;
      min-height: 100vh;
    }

    header {
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0px 20px;
      border-bottom: 1px solid #999;
      background-color: #ffffff;
    }

    .logo {
      width: 300px;
      height: 95px;
      display: flex;
      align-items: center;
      margin-left: -100px;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    nav {
      display: flex;
      gap: 20px;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
      margin-left: -100px;
    }

    .login {
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      color: #000;
      min-width: 70px;
    }
    .login i {
      font-size: 22px;
      color: black;
      margin: 6px 0;
    }

    .avatar {
      width: 27px;
      height: 27px;
      border: 2px solid #000;
      border-radius: 50%;
      margin: 3px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      color: #000;
    }

    .sign-in {
      border: none;
      background: transparent;
      padding: 0;
      font-weight: bold;
      font-size: 11px;
      color: #000;
      cursor: pointer;
    }

    .hero {
      height: 250px;
      border-bottom: 1px solid #aaa;
      position: relative;
      background-image: url("Plane\ Background.png");
      background-size: cover;
      background-position: center;
    }

    .fake-text {
      position: absolute;
      left: 70px;
      top: 85px;
    }

    .fake-text div {
      height: 10px;
      background: #e3e3e3;
      border-radius: 10px;
      margin: 12px;
    }

    .line1 { width: 260px; }
    .line2 { width: 160px; }
    .line3 { width: 210px; }


    .booking-box {
      width: 600px;
      min-height: 135px;
      border: 2px solid #777;
      border-radius: 40px;
      background: white;
      position: absolute;
      left: 50%;
      bottom: -150px;
      transform: translateX(-50%);
      padding: 25px 32px;
    }

    .booking-box h1 {
      margin: 0 0 15px;
      font-size: 23px;
      font-weight: normal;
    }
    .form-area { 
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 25px;
      row-gap: 15px;
      align-items: start;
    }

    .flight-route {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .plane-path {
      position: relative;
      width: 55px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dotted-line {
      position: absolute;
      width: 55px;
      border-top: 2px dashed #888;
    }
    .plane-icon {
      position: relative;
      background: white;
      padding: 2px;
      color: black;
      font-size: 16px;
      transform: rotate(15deg);
    }

    input, button {
      height: 38px;
      border: 2px solid #000000;
      border-radius: 9px;
      background: #ffffff;
      text-align: center;
      font-weight: bold;
    }

    .date {
      width: 100px;
      height: 28px;
      font-size: 11px;
    }

    .passengers {
      width: 130px;
    }
    .passenger-popup {
      display: none;
      position: absolute;
      background: white;
      border: 2px solid #777;
      border-radius: 15px;
      padding: 10px;
      width: 120px;
      right: 100px;
      bottom: 20px;
      box-shadow: 0 4px 10px #999;
      z-index: 10;
    }

    .passenger-popup.show {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
    }
    .passenger-popup label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
    }
    .passenger-popup input {
      width: 70px;
      height: 25px;
      margin-top: 4px;
      margin-top: 24px;
    }
    .radio-search-area{
       grid-column: 2;
       grid-row: 1 / 3;
       display: flex;
       flex-direction: column;
       gap: 12px;
       align-items: center;
    }
    .date-passenger-row {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .search {
      width: 95px;
      height: 35px;
      border-radius: 3px;
      background: #00a6d6;
      margin-top: 2px;
    }

    .radio-area {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .radio-option input {
      accent-color: #00a6d6;
      transform: scale(1.1);
    }

    .bottom-space {
      height: 220px;
      border-top: 1px solid #eee;
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="logo">
        <img src="FlyDreamAir.png" alt="Logo">
      </div>

      <nav>
        <span>Search Flights</span>
        <span>Manage Bookings</span>
        <span>Check-In</span>
        <span>Support</span>
      </nav>

      <div class="login">
        <div>A Member?</div>
        <i class="fa-solid fa-user"></i>
        <button class="sign-in">Sign In</button>
      </div>
    </header>

    <section class="hero">
      <div class="fake-text">
        <div class="line1"></div>
        <div class="line2"></div>
        <div class="line3"></div>
      </div>

      <div class="booking-box">
        <h1 style="color: #00a6d6;">Book Your Next Flight</h1>

        <div class="form-area">
          <div class="form-area">

  <div class="flight-route">

    <input type="text" placeholder="Departure Location">

    <div class="plane-path">
      <div class="dotted-line"></div>
      <i class="fa-solid fa-plane plane-icon"></i>
    </div>

    <input type="text" placeholder="Arrival Location">

  </div>

  <div class="radio-search-area">

    <div class="radio-area">

      <label class="radio-option">
        <input type="radio" name="trip" value="oneway">
        <span>One-Way</span>
      </label>

      <label class="radio-option">
        <input type="radio" name="trip" value="return" checked>
        <span>Return</span>
      </label>

    </div>

    <button class="search" id="search" style="color: #ffffff;">
      Search
    </button>

  </div>

  <div class="date-passenger-row">

    <input 
      class="date" 
      id="departureDate" 
      type="date" 
      value="2026-05-05"
    >

    <input 
      class="date" 
      id="returnDate" 
      type="date" 
      value="2026-05-05"
    >

    <button 
      class="passengers" 
      id="passengerBtn" 
      type="button"
    >
      Passengers
    </button>

  </div>

  <div class="passenger-popup" id="passengerPopup">

    <label>Adults</label>
    <input type="number" value="1" min="1" id="adults">

    <label>Children</label>
    <input type="number" value="0" min="0" id="children">

    <label>Infants</label>
    <input type="number" value="0" min="0" id="infants">

  </div>

</div>
    </section>

    <div class="bottom-space"></div>

  </div>
  <script type="module" src="searchMain.js"></script>
</body>
</html>
