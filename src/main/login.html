<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flight Results2</title>
  <script src="https://kit.fontawesome.com/a7f82b9220.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }
    .page {
      border: 3px solid #222;
      min-height: 100vh;
    }
    header {
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0px 20px;
      border-bottom: 1px solid #999;
      background-color: #ffffff;
    }
    .logo {
      width: 300px;
      height: 95px;
      display: flex;
      align-items: center;
      margin-left: -100px;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    nav {
      display: flex;
      gap: 20px;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
      margin-left: -100px;
    }
    .login {
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      color: #000;
      min-width: 70px;
    }
    .login i {
      font-size: 22px;
      color: black;
      margin: 6px 0;
    }
    .avatar {
      width: 27px;
      height: 27px;
      border: 2px solid #000;
      border-radius: 50%;
      margin: 3px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      color: #000;
    }

    .sign-in {
      border: none;
      background: transparent;
      padding: 0;
      font-weight: bold;
      font-size: 11px;
      color: #000;
      cursor: pointer;
    }
    </style>
    <body>
  <div class="page">

    <header>
      <div class="logo">
        <img src="FlyDreamAir.png" alt="Logo">
      </div>

      <nav>
        <span id="returnSearchBar">Search Flights</span>
        <span>Manage Bookings</span>
        <span>Check-In</span>
        <span>Support</span>
      </nav>

      <div class="login">
        <div>A Member?</div>
        <i class="fa-solid fa-user"></i>
        <button class="sign-in">Sign In</button>
      </div>
    </header>
    </div>
    </body>
    </head>
    <script>module:logginMain.js</script>
