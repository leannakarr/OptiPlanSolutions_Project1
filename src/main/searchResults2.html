<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flight Results2</title>
  <script src="https://kit.fontawesome.com/a7f82b9220.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }
    .page {
      border: 3px solid #222;
      min-height: 100vh;
    }
    header {
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0px 20px;
      border-bottom: 1px solid #999;
      background-color: #ffffff;
    }
    .logo {
      width: 300px;
      height: 95px;
      display: flex;
      align-items: center;
      margin-left: -100px;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    nav {
      display: flex;
      gap: 20px;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
      margin-left: -100px;
    }
    .login {
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      color: #000;
      min-width: 70px;
    }
    .login i {
      font-size: 22px;
      color: black;
      margin: 6px 0;
    }
    .avatar {
      width: 27px;
      height: 27px;
      border: 2px solid #000;
      border-radius: 50%;
      margin: 3px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      color: #000;
    }

    .sign-in {
      border: none;
      background: transparent;
      padding: 0;
      font-weight: bold;
      font-size: 11px;
      color: #000;
      cursor: pointer;
    }
    main{
      padding: 25px 28px 35px 28px;
    }
    #searchedInfoBar {
      display: flex;
      height: 110px;
      background: linear-gradient(to right, #008bb8, #48d2d0);
      border-radius: 6px;
      color: white;
      align-items: center;
      justify-content: space-between;
      padding: 0 45px;
      box-sizing: border-box;
    }
    .summary-left h1 {
      margin: 0 0 14px 0;
      font-size: 30px;
    }

    .summary-details {
      display: flex;
      gap: 20px;
      font-size: 15px;
      font-weight: bold;
    }

    .summary-middle {
      display: flex;
      align-items: center;
      gap: 35px;
    }
    #sortSelect {
      width: 210px;
      height: 34px;
      font-weight: bold;
      font-size: 14px;
      padding-left: 8px;
      border: 2px solid #000000;
      border-radius: 10px;
      background-color: white;
      cursor: pointer;
    }

    #modifySearchBtn {
      background-color: #028ec5;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 3px 25px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

  </style>
  </head>
  <body>
  <div class="page">

    <header>
      <div class="logo">
        <img src="FlyDreamAir.png" alt="Logo">
      </div>

      <nav>
        <span>Search Flights</span>
        <span>Manage Bookings</span>
        <span>Check-In</span>
        <span>Support</span>
      </nav>

      <div class="login">
        <div>A Member?</div>
        <i class="fa-solid fa-user"></i>
        <button class="sign-in">Sign In</button>
      </div>
    </header>

     <main>
      <section id="searchedInfoBar">
        <div class="summary-left">
          <h1 id="routeTitle">Syd-Mel</h1>
          <div class="summary-details">
            <span id="tripTypeText">One-Way</span>
            <span id="departureDateText">23 May 2026</span>
            <span id="passengerText">1 Adult</span>
            <span id="fareClassText">Economy</span>
          </div>
        </div>
        <div class="summary-middle">
          <select id="sortSelect">
            <option id="sortDepartureEarliest" value="departure-earliest">Departure Time (Earliest)</option>
            <option id="sortDepartureLatest" value="departure-latest">Departure Time (Latest)</option>
            <option id="sortPriceLowest" value="price-lowest">Price (Lowest)</option>
            <option id="sortPriceHighest" value="price-highest">Price (Highest)</option>
          </select>

          <button id="modifySearchBtn">Modify Search</button>
        </div>
      </section>
      </main>
    </div>
    </body>
    </html>
