<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flight Results2</title>
  <script src="https://kit.fontawesome.com/a7f82b9220.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }
    .page {
      border: 3px solid #222;
      min-height: 100vh;
    }
    header {
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0px 20px;
      border-bottom: 1px solid #999;
      background-color: #ffffff;
    }
    .logo {
      width: 300px;
      height: 95px;
      display: flex;
      align-items: center;
      margin-left: -100px;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    nav {
      display: flex;
      gap: 20px;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
      margin-left: -100px;
    }
    .login {
      text-align: center;
      font-size: 10px;
      font-weight: bold;
      color: #000;
      min-width: 70px;
    }
    .login i {
      font-size: 22px;
      color: black;
      margin: 6px 0;
    }
    .avatar {
      width: 27px;
      height: 27px;
      border: 2px solid #000;
      border-radius: 50%;
      margin: 3px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      color: #000;
    }

    .sign-in {
      border: none;
      background: transparent;
      padding: 0;
      font-weight: bold;
      font-size: 11px;
      color: #000;
      cursor: pointer;
    }
    main{
      padding: 25px 28px 35px 28px;
    }
    #searchedInfoBar {
      display: flex;
      height: 110px;
      background: linear-gradient(to right, #008bb8, #48d2d0);
      border-radius: 6px;
      color: white;
      align-items: center;
      justify-content: space-between;
      padding: 0 45px;
      box-sizing: border-box;
    }
    .summary-left h1 {
      margin: 0 0 14px 0;
      font-size: 30px;
    }

    .summary-details {
      display: flex;
      gap: 20px;
      font-size: 15px;
      font-weight: bold;
    }

    .summary-middle {
      display: flex;
      align-items: center;
      gap: 35px;
    }
    #sortSelect {
      width: 210px;
      height: 34px;
      font-weight: bold;
      font-size: 14px;
      padding-left: 8px;
      border: 2px solid #000000;
      border-radius: 10px;
      background-color: white;
      cursor: pointer;
    }

    #modifySearchBtn {
      background-color: #028ec5;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 3px 25px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .content {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 25px;
      margin-top: 20px;
    }

    #filterPanel {
      border: 2px solid #999;
      border-radius: 4px;
      padding: 22px 15px;
      box-sizing: border-box;
    }

    .filter-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .filter-title-row h2 {
      margin: 0;
      font-size: 16px;
    }
    #resetFiltersBtn {
      border: none;
      background: transparent;
      color: #028ec5;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-group {
      margin-bottom: 25px;
    }

    .filter-group h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
    }

    #priceRange {
      width: 100%;
      accent-color: #222;
    }

    .price-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: bold;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 8px 0;
      font-size: 11px;
      font-weight: bold;
      accent-color: #028ec5;
    }
    .results-area {
      min-width: 0;
    }

    #resultsHeading {
      font-size: 12px;
      margin: 32px 0 18px 0;
      font-weight: bold;
    }

    #flightResultsContainer {
      height: 535px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .flight-card {
    width: 840px;
    height: 85px;
    border: 1px solid #444;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 30px;
    padding: 0 22px;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    background-color: white;
    }
    
.airline-section {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 145px;
}

.logo {
    font-size: 28px;
    color: #1c9edb;
}

.airline-section h3 {
    margin: 0;
    color: #269ad6;
    font-size: 16px;
}

.airline-section p {
    margin: 1px 0;
    font-size: 11px;
    font-weight: bold;
}

.time-section {
    display: flex;
    align-items: center;
    gap: 18px;
    flex: 1;
}

.time-block h2 {
    margin: 0;
    font-size: 28px;
}

.time-block p {
    margin: 2px 0 0;
    font-size: 15px;
    color: #333;
}

.line-section {
    width: 200px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
}

.line-section p {
    margin: 2px 0;
}

.flight-line {
    display: flex;
    align-items: center;
}

.flight-line span:first-child {
    height: 2px;
    background-color: #bbb;
    flex: 1;
}

.plane {
    color: #aaa;
    font-size: 22px;
    margin-left: -6px;
}

.price-section {
    width: 80px;
}

.price-section p {
    margin: 0;
    font-size: 12px;
    font-weight: bold;
}

.price-section h2 {
    margin: 0;
    font-size: 30px;
}

.button-section {
    width: 100px;
    text-align: center;
}

.button-section button {
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 28px;
    font-weight: bold;
    cursor: pointer;
}

.button-section p {
    margin: 5px 0 0;
    color: #3498db;
    font-size: 11px;
    cursor: pointer;
}
.flight-wrapper {
    margin-bottom: 15px;
}

.info-card {
    width: 850px;
    display: flex;
    border: 1px solid #444;
    border-top: none;
    background-color: white;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
}

.info-column {
    width: 33.33%;
    padding: 10px 20px 18px 20px;
    box-sizing: border-box;
    border-right: 1px solid #aaa;
}

.info-column:last-child {
    border-right: none;
}

.info-column h2 {
    margin: 0 0 18px 0;
    text-align: center;
    color: #269ad6;
    font-size: 24px;
}

.info-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-bottom: 8px;
    font-size: 15px;
}
  </style>
  </head>
  <body>
  <div class="page">

    <header>
      <div class="logo">
        <img src="FlyDreamAir.png" alt="Logo">
      </div>

      <nav>
        <span>Search Flights</span>
        <span>Manage Bookings</span>
        <span>Check-In</span>
        <span>Support</span>
      </nav>

      <div class="login">
        <div>A Member?</div>
        <i class="fa-solid fa-user"></i>
        <button class="sign-in">Sign In</button>
      </div>
    </header>

     <main>
      <section id="searchedInfoBar">
        <div class="summary-left">
          <h1 id="routeTitle">Syd-Mel</h1>
          <div class="summary-details">
            <span id="tripTypeText">One-Way</span>
            <span id="departureDateText">23 May 2026</span>
            <span id="passengerText">1 Adult</span>
            <span id="fareClassText">Economy</span>
          </div>
        </div>
        <div class="summary-middle">
          <select id="sortSelect">
            <option id="sortDepartureEarliest" value="time">Departure Time (Earliest)</option>
            <option id="sortDepartureLatest" value="time-reverse">Departure Time (Latest)</option>
            <option id="sortPriceLowest" value="price">Price (Lowest)</option>
            <option id="sortPriceHighest" value="price-reverse">Price (Highest)</option>
          </select>

          <button id="modifySearchBtn">Modify Search</button>
        </div>
      </section>


      <section class="content">
        <aside id="filterPanel">
          <div class="filter-title-row">
            <h2 id="filterTitle">Search Filters</h2>
            <button id="resetFiltersBtn">Reset</button>
          </div>

          <div class="filter-group">
            <h3 id="priceRangeTitle">Price Range</h3>
            <input id="priceRange" type="range" min="50" max="600" value="600">
            <div class="price-labels">
              <span id="minPriceLabel">$50</span>
              <span id="maxPriceLabel">$600+</span>
            </div>
          </div>

          <div class="filter-group">
            <h3 id="departureTimeTitle">Departure Time</h3>

            <label class="checkbox-row">
              <input id="morningCheckbox" type="checkbox" checked = "true">
              Morning
            </label>

            <label class="checkbox-row">
              <input id="afternoonCheckbox" type="checkbox" checked = "true">
              Afternoon
            </label>

            <label class="checkbox-row">
              <input id="eveningCheckbox" type="checkbox" checked = "true">
              Evening
            </label>
          </div>

          <div class="filter-group">
            <h3 id="stopsTitle">Stops</h3>

            <label class="checkbox-row">
              <input id="noStopsCheckbox" type="checkbox" checked = "true">
              No Stops
            </label>

            <label class="checkbox-row">
              <input id="oneStopCheckbox" type="checkbox" checked = "true">
              1 Stop
            </label>

            <label class="checkbox-row">
              <input id="multipleStopsCheckbox" type="checkbox" checked = "true">
              Multiple Stops
            </label>
          </div>
        </aside>
        <section class="results-area">
            <h2 id="resultsHeading"></h2>
            <div id="flightResultsContainer"></div>
        </section>
      </main>
    </div>
    </body>
    <script type="module" src="searchResults2.js"></script>
    </html>
