<!DOCTYPE html>
<html>
<head>
  <title>Payment Test</title>
</head>

<body>
  <h1>Payment Test</h1>

  <button id="testBtn">Test Payment</button>

  <div id="result"></div>

  <script type="module">

    import Booking from "../Classes/Booking.js";
    import Payment from "../Classes/Payment.js";
    import Passenger from "../Classes/Passenger.js";
    import Seat from "../Classes/Seat.js";
    import Ticket from "../Classes/Ticket.js";

    const fakeFlight = {
      id: "SYD_MEL_20260514_0900",
      price: 120,
      date: "2026-05-14",
      time: "09:00"
    };

    document.getElementById("testBtn").addEventListener("click", () => {

      // passengers
      const passenger1 = new Passenger(
        "Ms",
        "Cami",
        "Rose",
        "2002-10-09",
        "Female",
        "Australian",
        "cami@email.com",
        "12345678",
        "2500"
      );

      const passenger2 = new Passenger(
        "Mr",
        "Alphi",
        "Bian",
        "2001-05-03",
        "Male",
        "Australian",
        "sam@email.com",
        "0400000000",
        "2500"
      );

      // seats
      const seat1 = new Seat("12A", "Economy");
      const seat2 = new Seat("12B", "Economy");

      // tickets
      const ticket1 = new Ticket(
        passenger1,
        fakeFlight,
        seat1,
        "20",
        ["meal"],
        ["water"]
      );

      const ticket2 = new Ticket(
        passenger2,
        fakeFlight,
        seat2,
        "30",
        [],
        ["juice"]
      );

      // booking
      const booking = new Booking(
        fakeFlight,
        null,
        [ticket1, ticket2]
      );

      // payment
      const payment = new Payment(
        booking,
        "Visa",
        "123456789012"
      );

      const success = payment.processPayment();

      document.getElementById("result").innerHTML = `
        <h2>Payment Result</h2>

        <p><strong>Payment Success:</strong> ${success}</p>

        <p><strong>Payment Status:</strong> ${payment.status}</p>

        <p><strong>Booking Status:</strong> ${booking.status}</p>

        <p><strong>Booking ID:</strong> ${booking.bookingId}</p>

        <p><strong>Total Price:</strong> $${booking.bookingCost()}</p>

        <h3>Passengers</h3>

        <p>
          ${ticket1.passenger.firstName}
          ${ticket1.passenger.lastName}
          - Seat ${ticket1.seat.seatNumber}
        </p>

        <p>
          ${ticket2.passenger.firstName}
          ${ticket2.passenger.lastName}
          - Seat ${ticket2.seat.seatNumber}
        </p>
      `;
    });

  </script>
</body>
</html>
